# ===================================================================
# PANACEA CONSULTANCY — Local Development Environment
# ===================================================================
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# ===================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: panacea-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: panacea
      POSTGRES_USER: panacea_app
      POSTGRES_PASSWORD: panacea_dev_password_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panacea_app -d panacea"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: panacea-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: panacea_minio_dev
      MINIO_ROOT_PASSWORD: panacea_minio_secret_change_me
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: panacea-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 panacea_minio_dev panacea_minio_secret_change_me;
        mc mb --ignore-existing local/panacea-documents;
        mc anonymous set none local/panacea-documents;
        echo 'Bucket created with PRIVATE access policy';
      "

  # ClamAV for malware scanning (optional — disabled by default)
  # Uncomment when testing document upload security
  # clamav:
  #   image: clamav/clamav:latest
  #   container_name: panacea-clamav
  #   restart: unless-stopped
  #   ports:
  #     - "3310:3310"
  #   volumes:
  #     - clamav-data:/var/lib/clamav

volumes:
  pgdata:
    driver: local
  minio-data:
    driver: local
  # clamav-data:
  #   driver: local
