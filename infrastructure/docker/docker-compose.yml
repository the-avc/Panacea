# ===================================================================
# PANACEA CONSULTANCY — Development/Local Container Infrastructure
# ===================================================================
# NOTE: This Compose configuration exposes ports (5432, 9000, 9001, 6379, 3310)
# to localhost FOR LOCAL DEVELOPMENT AND TESTING ONLY.
#
# IN PRODUCTION:
# Never expose PostgreSQL, Redis, MinIO, or ClamAV to the public Internet or host network.
# Use `infrastructure/docker/docker-compose.prod.yml` which deploys these services
# on an internal, unexposed private network reachable only by the API application container.
#
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# ===================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: panacea-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-panacea}
      POSTGRES_USER: ${DATABASE_USER:-panacea_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-panacea_app} -d ${DATABASE_NAME:-panacea}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: panacea-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: panacea-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\";
        mc mb --ignore-existing local/\"$${S3_BUCKET:-panacea-documents}\";
        mc anonymous set none local/\"$${S3_BUCKET:-panacea-documents}\";
        echo 'Bucket created with PRIVATE access policy';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-panacea-documents}

  # Redis for centralized rate limiting and multi-instance session distribution
  redis:
    image: redis:7-alpine
    container_name: panacea-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      /bin/sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
        else
          exec redis-server --appendonly yes;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClamAV for malware scanning
  clamav:
    image: clamav/clamav:latest
    container_name: panacea-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local
  clamav-data:
    driver: local
