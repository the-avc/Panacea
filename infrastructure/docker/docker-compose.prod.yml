# ===================================================================
# PANACEA CONSULTANCY — Production Container Infrastructure Topology
# ===================================================================
# PRODUCTION SECURITY SPECIFICATION:
# - ZERO host port bindings for PostgreSQL, Redis, MinIO, or ClamAV.
# - All stateful dependencies communicate exclusively over an isolated
#   internal bridge network (panacea_internal_net).
# - Only the API gateway / reverse proxy ingress may bind public ports (443).
# - Mandatory health checks and failure recovery on all dependencies.
# ===================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: panacea-postgres-prod
    restart: always
    # NO ports exposed to host. Internal container network only.
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - panacea_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: panacea-minio-prod
    restart: always
    # NO ports exposed to host. Internal container network only.
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data_prod:/data
    command: server /data
    networks:
      - panacea_internal_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: panacea-minio-init-prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\";
        mc mb --ignore-existing local/\"$${S3_BUCKET:-panacea-documents}\";
        mc anonymous set none local/\"$${S3_BUCKET:-panacea-documents}\";
        echo 'Bucket created with PRIVATE access policy';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-panacea-documents}
    networks:
      - panacea_internal_net

  redis:
    image: redis:7-alpine
    container_name: panacea-redis-prod
    restart: always
    # NO ports exposed to host. Internal container network only.
    expose:
      - "6379"
    command: >
      /bin/sh -c "
        exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - panacea_internal_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: panacea-clamav-prod
    restart: always
    # NO ports exposed to host. Internal container network only.
    expose:
      - "3310"
    volumes:
      - clamav_data_prod:/var/lib/clamav
    networks:
      - panacea_internal_net
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  panacea_internal_net:
    driver: bridge
    internal: true # Disallows external egress/ingress directly to state containers

volumes:
  pgdata_prod:
    driver: local
  minio_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  clamav_data_prod:
    driver: local
