# ===================================================================
# PANACEA CONSULTANCY PRIVATE LIMITED
# Hardened Production Nginx Reverse Proxy Configuration
# ===================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure

    # Logging with Correlation Request ID
    log_format institutional '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'request_id="$http_x_request_id" rt=$request_time';

    access_log /var/log/nginx/access.log institutional;

    # Rate Limiting Zones (SYSTEM-SPEC & SECURITY.md compliance)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=doc_limit:10m rate=20r/m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Security Headers (Applied Globally)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Upstreams
    upstream panacea_web {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream panacea_portal {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    upstream panacea_api {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    # ===================================================================
    # 1. Public Website: panaceaconsultancy.in
    # ===================================================================
    server {
        listen 80;
        server_name panaceaconsultancy.in www.panaceaconsultancy.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name panaceaconsultancy.in www.panaceaconsultancy.in;

        ssl_certificate /etc/letsencrypt/live/panaceaconsultancy.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panaceaconsultancy.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://panacea_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ===================================================================
    # 2. Institutional Client & Directorate Portal: portal.panaceaconsultancy.in
    # ===================================================================
    server {
        listen 80;
        server_name portal.panaceaconsultancy.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name portal.panaceaconsultancy.in;

        ssl_certificate /etc/letsencrypt/live/portal.panaceaconsultancy.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portal.panaceaconsultancy.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Mandatory Anti-Indexing
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://panacea_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ===================================================================
    # 3. Secure Backend API: api.panaceaconsultancy.in
    # ===================================================================
    server {
        listen 80;
        server_name api.panaceaconsultancy.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.panaceaconsultancy.in;

        ssl_certificate /etc/letsencrypt/live/api.panaceaconsultancy.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.panaceaconsultancy.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Strict 50MB Body Limit for certified court documents
        client_max_body_size 50M;

        # Authentication Rate Limiting
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://panacea_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Document Upload Rate Limiting
        location /api/v1/documents {
            limit_req zone=doc_limit burst=10 nodelay;
            proxy_pass http://panacea_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Endpoints
        location / {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://panacea_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
